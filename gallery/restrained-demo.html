<head>
<meta charset="utf-8">

<title>restrained-demo</title>
<style>
:root { color-scheme: light; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; color: #183047; background: #edf1f5; }
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; }
.tc-toolbar { position: sticky; top: 0; z-index: 20; padding: 15px max(20px, calc((100vw - 1232px) / 2)); background: #ffffff; border-bottom: 1px solid #d8e1e9; box-shadow: 0 2px 10px #10263e08; }
.tc-toolbar-main { display: flex; align-items: center; gap: 20px; justify-content: space-between; }
.tc-brand { min-width: 0; }
.tc-kicker { margin: 0 0 4px; font-size: 10px; font-weight: 700; letter-spacing: .17em; color: #53718b; }
h1 { margin: 0; font-size: 18px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
.tc-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.tc-button { min-height: 38px; padding: 9px 15px; border: 1px solid #c8d3de; border-radius: 6px; background: #fff; color: #24445f; cursor: pointer; font-size: 13px; line-height: 1.3; white-space: nowrap; }
.tc-button:hover { background: #f0f5fa; border-color: #7d99af; }
.tc-button:focus-visible { outline: 3px solid #72a9db; outline-offset: 2px; }
.tc-button:disabled { opacity: .42; cursor: default; }
.tc-button-primary { background: #173c5b; border-color: #173c5b; color: white; }
.tc-button-primary:hover { background: #245276; color: white; }
.tc-toolbar-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; font-size: 11px; line-height: 1.5; color: #6a7d8e; }
#tc-status { color: #49647a; }
#tc-status[data-tone="warning"] { color: #a44a20; }
.tc-edit-tools { display: none; align-items: center; gap: 7px; border-top: 1px solid #e4eaf0; margin-top: 12px; padding-top: 10px; font-size: 12px; }
.tc-is-editing .tc-edit-tools { display: flex; flex-wrap: wrap; }
.tc-edit-tools .tc-button { min-height: 30px; padding: 5px 10px; font-size: 12px; }
.tc-edit-tools-label { margin-right: 4px; color: #6a7d8e; }
.tc-document { max-width: 1232px; margin: 0 auto; padding: 20px 20px 60px; }
.tc-slide { margin: 0 0 30px; break-inside: avoid; }
.tc-page-label { display: flex; justify-content: space-between; padding: 0 1px 9px; color: #7a8b99; font-size: 11px; }
.tc-slide-scroll { overflow-x: auto; background: #fff; border: 1px solid #d9e1e8; border-radius: 3px; box-shadow: 0 8px 22px #10263e07; }
.tc-slide-canvas { background: #fff; }
.tc-slide-canvas > svg { display: block; width: 100%; height: auto; }
.tc-is-editing .tc-slide-canvas { min-width: 960px; }
.tc-editable { outline: none; cursor: text; }
.tc-is-editing .tc-editable { outline: 1px dashed #447ba733; outline-offset: 1px; }
.tc-is-editing .tc-editable:hover { outline-color: #447ba7a0; }
.tc-is-editing .tc-editable:focus { outline: 1.5px solid #337bb6; background-color: #e8f3ff80; }
.tc-is-editing .tc-editable.tc-overflow { outline-color: #c56337; }
.tc-is-editing .tc-editable::selection, .tc-is-editing .tc-editable *::selection { background: #87b7e799; }
.tc-editable p { margin: 0; }
.tc-footer { padding: 2px 0 0; font-size: 11px; color: #7d8e9e; line-height: 1.6; }
noscript { display: block; padding: 12px 20px; background: #fff4da; color: #765622; }
@media (max-width: 700px) {
  .tc-toolbar { padding: 12px; }
  .tc-toolbar-main { align-items: flex-start; flex-direction: column; gap: 12px; }
  h1 { font-size: 16px; }
  .tc-actions { flex-wrap: wrap; gap: 6px; }
  .tc-button { padding: 8px 12px; }
  .tc-document { padding: 16px 10px 35px; }
  .tc-toolbar-meta { font-size: 10px; }
  .tc-slide { margin-bottom: 22px; }
}
@media print {
  @page { size: landscape; margin: 0; }
  :root, body { background: white; }
  .tc-toolbar, .tc-page-label, .tc-footer, noscript { display: none !important; }
  .tc-document { max-width: none; margin: 0; padding: 0; }
  .tc-slide { margin: 0; break-after: page; }
  .tc-slide:last-of-type { break-after: auto; }
  .tc-slide-scroll { overflow: visible; border: 0; border-radius: 0; box-shadow: none; }
  .tc-is-editing .tc-slide-canvas { min-width: 0; }
  .tc-editable { outline: none !important; background-color: transparent !important; }
}
</style>

<script>
(() => {
  'use strict';
  const body = document.body;
  const boxes = [...document.querySelectorAll('.tc-editable')];
  const editButton = document.getElementById('tc-edit');
  const resetButton = document.getElementById('tc-reset');
  const saveButton = document.getElementById('tc-save');
  const status = document.getElementById('tc-status');
  const sizeButtons = ['tc-smaller', 'tc-larger', 'tc-fit'].map(id => document.getElementById(id));
  const initial = new Map(boxes.map(box => [box, {html: box.innerHTML, style: box.getAttribute('style')} ]));
  let editing = false;
  let activeBox = null;
  let unsaved = false;
  let changed = false;

  function say(message, warning = false) {
    status.textContent = message;
    if (warning) status.dataset.tone = 'warning'; else delete status.dataset.tone;
  }

  function setEditing(enabled) {
    if (!enabled && document.activeElement instanceof HTMLElement) document.activeElement.blur();
    editing = enabled;
    body.classList.toggle('tc-is-editing', enabled);
    editButton.textContent = enabled ? '完成编辑' : '编辑文字';
    editButton.setAttribute('aria-pressed', String(enabled));
    boxes.forEach(box => {
      box.setAttribute('contenteditable', String(enabled));
      box.setAttribute('tabindex', enabled ? '0' : '-1');
      box.setAttribute('spellcheck', 'false');
      if (enabled) {
        box.setAttribute('role', 'textbox');
        box.setAttribute('aria-multiline', 'true');
      } else {
        box.removeAttribute('role');
        box.removeAttribute('aria-multiline');
      }
    });
    // SVG 的 img 角色会隐藏其内部交互节点，编辑时改为可访问的分组。
    document.querySelectorAll('.tc-slide-canvas > svg').forEach(svg => svg.setAttribute('role', enabled ? 'group' : 'img'));
    sizeButtons.forEach(button => button.disabled = !enabled || !activeBox);
    say(enabled ? '直接点击文字修改；超出边界时，可缩小字号或适配文字框。' : (unsaved ? '修改尚未保存。点击“保存 HTML”下载副本。' : '查看模式 · 点击“编辑文字”可继续修改。'));
  }

  function markChanged() {
    changed = true;
    unsaved = true;
    resetButton.disabled = false;
    say('有未保存的修改 · 完成后点击“保存 HTML”。');
  }

  function hasOverflow(box) {
    const outer = box.getBoundingClientRect();
    if (!outer.width || !outer.height) return false;
    const walk = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walk.nextNode())) {
      if (!node.textContent.trim()) continue;
      const range = document.createRange();
      range.selectNodeContents(node);
      for (const rect of range.getClientRects()) {
        if (rect.left < outer.left - 1.5 || rect.top < outer.top - 1.5 || rect.right > outer.right + 1.5 || rect.bottom > outer.bottom + 1.5) return true;
      }
    }
    return false;
  }

  function checkBox(box) {
    const overflow = hasOverflow(box);
    box.classList.toggle('tc-overflow', overflow);
    if (overflow) say('这段文字超出边界：请缩短文字、缩小字号，或点击“适配文字框”。', true);
    return overflow;
  }

  function scaleFont(box, factor) {
    const styled = [box, ...box.querySelectorAll('*')].filter(element => element.style.fontSize);
    if (!styled.length) {
      box.style.fontSize = `${parseFloat(getComputedStyle(box).fontSize)}px`;
      styled.push(box);
    }
    let resized = false;
    styled.forEach(element => {
      const match = element.style.fontSize.match(/^([\d.]+)(px|pt)$/);
      if (!match) return;
      const oldSize = Number(match[1]);
      const next = Math.max(4, Math.min(120, oldSize * factor));
      if (Math.abs(oldSize - next) > .001) {
        element.style.fontSize = `${next.toFixed(3)}${match[2]}`;
        resized = true;
      }
    });
    return resized;
  }

  function insertPlainText(box, text) {
    // 优先保留浏览器撤销栈与当前文字样式；退路仍只插入文本节点。
    box.focus();
    if (document.execCommand('insertText', false, text)) return;
    const selection = window.getSelection();
    if (!selection || !selection.rangeCount || !box.contains(selection.anchorNode)) return;
    const range = selection.getRangeAt(0);
    range.deleteContents();
    const node = document.createTextNode(text);
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
    markChanged();
    requestAnimationFrame(() => checkBox(box));
  }

  boxes.forEach(box => {
    box.addEventListener('focus', () => {
      if (!editing) return;
      activeBox = box;
      sizeButtons.forEach(button => button.disabled = false);
    });
    box.addEventListener('input', () => {
      markChanged();
      requestAnimationFrame(() => checkBox(box));
    });
    box.addEventListener('paste', event => {
      event.preventDefault();
      if (editing) insertPlainText(box, event.clipboardData?.getData('text/plain') || '');
    });
    box.addEventListener('beforeinput', event => {
      if (event.inputType === 'insertFromDrop') event.preventDefault();
      if (event.inputType === 'insertFromPaste') {
        event.preventDefault();
        if (editing && event.dataTransfer) insertPlainText(box, event.dataTransfer.getData('text/plain'));
      }
    });
    box.addEventListener('dragover', event => event.preventDefault());
    box.addEventListener('drop', event => {
      event.preventDefault();
      say('请直接输入或粘贴纯文字。', true);
    });
  });

  editButton.addEventListener('click', () => setEditing(!editing));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && editing) {
      setEditing(false);
      editButton.focus();
    }
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
      event.preventDefault();
      saveDocument();
    }
  });
  sizeButtons.forEach(button => button.addEventListener('mousedown', event => event.preventDefault()));
  sizeButtons[0].addEventListener('click', () => {
    if (activeBox && scaleFont(activeBox, .9)) { markChanged(); checkBox(activeBox); }
  });
  sizeButtons[1].addEventListener('click', () => {
    if (activeBox && scaleFont(activeBox, 1.1)) { markChanged(); checkBox(activeBox); }
  });
  sizeButtons[2].addEventListener('click', () => {
    if (!activeBox) return;
    let resized = false;
    for (let index = 0; index < 40 && hasOverflow(activeBox); index++) {
      if (!scaleFont(activeBox, .92)) break;
      resized = true;
    }
    if (resized) markChanged();
    if (!checkBox(activeBox)) say('文字已放入边界内。保存 HTML 后保留当前字号。');
  });

  resetButton.addEventListener('click', () => {
    if (!changed || !window.confirm('还原为打开这个文件时的文字和字号？已下载的文件不会改变。')) return;
    initial.forEach((value, box) => {
      box.innerHTML = value.html;
      if (value.style === null) box.removeAttribute('style'); else box.setAttribute('style', value.style);
      box.classList.remove('tc-overflow');
    });
    changed = false;
    unsaved = false;
    resetButton.disabled = true;
    say('已还原为打开此文件时的内容。');
  });

  function saveDocument() {
    try {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelector('body').classList.remove('tc-is-editing');
      clone.querySelectorAll('.tc-editable').forEach(box => {
        box.setAttribute('contenteditable', 'false');
        box.setAttribute('tabindex', '-1');
        box.removeAttribute('role');
        box.removeAttribute('aria-multiline');
        box.classList.remove('tc-overflow');
      });
      clone.querySelectorAll('.tc-slide-canvas > svg').forEach(svg => svg.setAttribute('role', 'img'));
      const clonedEdit = clone.querySelector('#tc-edit');
      clonedEdit.textContent = '编辑文字';
      clonedEdit.setAttribute('aria-pressed', 'false');
      ['tc-reset', 'tc-smaller', 'tc-larger', 'tc-fit'].forEach(id => clone.querySelector(`#${id}`).disabled = true);
      const clonedStatus = clone.querySelector('#tc-status');
      clonedStatus.textContent = '已保存的图表 · 点击“编辑文字”可继续修改。';
      delete clonedStatus.dataset.tone;
      const payload = '<!doctype html>\n' + clone.outerHTML;
      const url = URL.createObjectURL(new Blob([payload], {type: 'text/html;charset=utf-8'}));
      const link = document.createElement('a');
      const stem = (body.dataset.filename || 'charts.html').replace(/\.html?$/i, '').replace(/-edited$/, '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '-');
      link.download = `${stem || 'charts'}-edited.html`;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      unsaved = false;
      say('已生成保存副本。请保留下载的 HTML 文件，重新打开即可继续编辑。');
    } catch (error) {
      say('保存未完成，请重试或使用浏览器“另存为”。', true);
      console.error(error);
    }
  }
  saveButton.addEventListener('click', saveDocument);
  window.addEventListener('beforeunload', event => {
    if (!unsaved) return;
    event.preventDefault();
    event.returnValue = '';
  });
})();
</script>
</body>
</html>
